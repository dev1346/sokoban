<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sokoban</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
    position: fixed;
    width: 100%;
    height: 100%;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.2rem;
    color: #e94560;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
    letter-spacing: 4px;
  }

  .level-name {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 0.5rem;
    font-style: italic;
  }

  .info-bar {
    display: flex;
    gap: 2rem;
    margin-bottom: 0.8rem;
    font-size: 0.95rem;
    color: #aaa;
  }

  .info-bar span { color: #0f3460; font-weight: bold; }
  .info-bar .val { color: #e94560; }

  #game-canvas {
    border: 2px solid #0f3460;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(15, 52, 96, 0.5);
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 60vh;
    object-fit: contain;
  }

  .controls {
    margin-top: 1rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #16213e;
    padding: 0.5rem 1.2rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
    touch-action: manipulation;
  }

  button:hover { background: #e94560; color: #fff; }

  .help {
    margin-top: 0.8rem;
    font-size: 0.8rem;
    color: #555;
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  .win-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .win-overlay h2 {
    font-size: 2.5rem;
    color: #e94560;
    margin-bottom: 0.5rem;
  }

  .win-overlay p {
    font-size: 1.1rem;
    color: #ccc;
    margin-bottom: 1.5rem;
  }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin-top: 1rem;
    position: relative;
    width: 160px;
    height: 160px;
    touch-action: none;
  }

  .dpad button {
    position: absolute;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .dpad .up    { top: 0; left: 54px; }
  .dpad .down  { bottom: 0; left: 54px; }
  .dpad .left  { top: 54px; left: 0; }
  .dpad .right { top: 54px; right: 0; }

  /* Mobile responsive scaling */
  @media (pointer: coarse) {
    .dpad { display: block; }
    
    body {
      padding: 0.5rem;
    }
    
    h1 {
      font-size: 1.5rem;
    }
    
    .info-bar {
      gap: 1rem;
      font-size: 0.85rem;
    }
    
    #game-canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
    
    .controls {
      gap: 0.4rem;
    }
    
    button {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }
    
    .win-overlay h2 {
      font-size: 1.8rem;
    }
    
    .win-overlay p {
      font-size: 0.95rem;
      padding: 0 1rem;
      text-align: center;
    }
    
    .win-overlay button {
      font-size: 1rem;
      padding: 0.6rem 1.5rem;
    }
  }
</style>
</head>
<body>

<h1>SOKOBAN</h1>
<div class="level-name" id="level-name"></div>

<div class="info-bar">
  <div>Level: <span class="val" id="level-num">1</span><span class="val" id="level-total"></span></div>
  <div>Moves: <span class="val" id="move-count">0</span></div>
  <div>Pushes: <span class="val" id="push-count">0</span></div>
</div>

<canvas id="game-canvas"></canvas>

<div class="controls">
  <button onclick="undo()">Undo (Z)</button>
  <button onclick="restartLevel()">Restart (R)</button>
  <button onclick="prevLevel()">&#9664; Prev (P)</button>
  <button onclick="nextLevel()">Next (N) &#9654;</button>
  <button onclick="if(confirm('Reset all progress?')){localStorage.removeItem('sokoban_highest_solved'); loadLevel(0);}">Reset Progress</button>
  <span style="margin-left:1rem; display:flex; align-items:center; gap:0.4rem;">
    <label for="goto-input" style="color:#888; font-size:0.9rem;">Go to:</label>
    <input id="goto-input" type="number" min="1" max="152" 
           style="width:70px; background:#0f3460; color:#e0e0e0; border:1px solid #16213e; 
                  border-radius:4px; padding:0.4rem 0.5rem; font-size:0.9rem;"
           onkeydown="if(event.key==='Enter'){goToLevel(parseInt(this.value)); this.value='';}">
    <button onclick="goToLevel(parseInt(document.getElementById('goto-input').value)); document.getElementById('goto-input').value='';">Go</button>
  </span>
</div>

<div class="dpad">
  <button class="up" ontouchstart="move(0,-1);event.preventDefault();" onclick="move(0,-1)">▲</button>
  <button class="down" ontouchstart="move(0,1);event.preventDefault();" onclick="move(0,1)">▼</button>
  <button class="left" ontouchstart="move(-1,0);event.preventDefault();" onclick="move(-1,0)">◀</button>
  <button class="right" ontouchstart="move(1,0);event.preventDefault();" onclick="move(1,0)">▶</button>
</div>

<p class="help">Arrow keys / WASD to move · Z undo · R restart · N next · P prev · Enter next (solved)</p>

<div class="win-overlay" id="win-overlay">
  <h2>🎉 Level Complete!</h2>
  <p id="win-stats"></p>
  <button onclick="nextLevel(); hideWin();">Next Level ▶</button>
</div>

let currentLevel = 0;
let grid, playerX, playerY, playerDir, moves, pushes, history, won;

function parseLevel(lvl) {
  const rows = lvl;
  const h = rows.length;
  const w = Math.max(...rows.map(r => r.length));
  const padded = rows.map(r => r.padEnd(w, ' '));

  const walls = [];
  const targets = [];
  const boxes = [];
  let px = 0, py = 0;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = padded[y][x];
      if (ch === '#') walls.push(`${x},${y}`);
      if (ch === '.' || ch === '+' || ch === '*') targets.push({ x, y });
      if (ch === '$' || ch === '*') boxes.push({ x, y });
      if (ch === '@' || ch === '+') { px = x; py = y; }
    }
  }

  return { w, h, walls: new Set(walls), targets, boxes, px, py };
}

function loadLevel(idx) {
  currentLevel = idx;
  const data = parseLevel(LEVELS[idx]);
  grid = data;
  playerX = data.px;
  playerY = data.py;
  playerDir = 'down'; // default facing direction
  moves = 0;
  pushes = 0;
  history = [];
  won = false;

  // Calculate available space for canvas
  const headerHeight = 120; // h1 + level-name + info-bar
  const controlsHeight = 100; // controls + dpad + help
  const availableHeight = window.innerHeight - headerHeight - controlsHeight;
  const availableWidth = window.innerWidth - 20;
  
  // Calculate tile size to fit
  const maxTileByHeight = Math.floor(availableHeight / data.h);
  const maxTileByWidth = Math.floor(availableWidth / data.w);
  const optimalTile = Math.min(TILE, maxTileByHeight, maxTileByWidth);
  
  canvas.width = data.w * optimalTile;
  canvas.height = data.h * optimalTile;
  
  // Store current tile size for drawing
  canvas.dataset.tileSize = optimalTile;

  updateUI();
  draw();
}

// ── Rendering ──────────────────────────────────────────────────────
function draw() {
  const { w, h, walls, targets, boxes } = grid;
  const targetSet = new Set(targets.map(t => `${t.x},${t.y}`));
  const boxSet = new Set(boxes.map(b => `${b.x},${b.y}`));
  
  // Use dynamic tile size
  const TILE = parseInt(canvas.dataset.tileSize) || 48;

  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const key = `${x},${y}`;
      const px = x * TILE;
      const py = y * TILE;

      if (walls.has(key)) {
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = '#1a1a4e';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
        ctx.strokeStyle = '#162a55';
        ctx.beginPath();
        ctx.moveTo(px, py + TILE / 2);
        ctx.lineTo(px + TILE, py + TILE / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px + TILE / 2, py);
        ctx.lineTo(px + TILE / 2, py + TILE / 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = '#222244';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(px, py, TILE, TILE);
      }

      if (targetSet.has(key) && !boxSet.has(key)) {
        ctx.fillStyle = '#e94560';
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(px + TILE / 2, py + TILE / 2, TILE / 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#e94560';
        ctx.globalAlpha = 0.7;
        const s = 4;
        ctx.beginPath();
        ctx.moveTo(px + TILE/2, py + TILE/2 - s);
        ctx.lineTo(px + TILE/2 + s, py + TILE/2);
        ctx.lineTo(px + TILE/2, py + TILE/2 + s);
        ctx.lineTo(px + TILE/2 - s, py + TILE/2);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  for (const b of boxes) {
    const onTarget = targetSet.has(`${b.x},${b.y}`);
    const bx = b.x * TILE;
    const by = b.y * TILE;
    const pad = 3;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(bx + pad + 2, by + pad + 2, TILE - pad * 2, TILE - pad * 2);

    // Euro pallet base
    const palletColor = onTarget ? '#2ecc71' : '#C4A574';
    const plankColor = onTarget ? '#27ae60' : '#A08050';
    
    // Draw pallet base
    ctx.fillStyle = palletColor;
    ctx.fillRect(bx + pad, by + pad, TILE - pad * 2, TILE - pad * 2);
    
    // Draw horizontal planks (Euro pallet style)
    ctx.strokeStyle = plankColor;
    ctx.lineWidth = 1;
    const plankWidth = TILE - pad * 2;
    const plankHeight = (TILE - pad * 2) / 5;
    
    for (let i = 0; i < 5; i++) {
      const plankY = by + pad + i * plankHeight;
      ctx.fillStyle = i % 2 === 0 ? plankColor : palletColor;
      ctx.fillRect(bx + pad, plankY, plankWidth, plankHeight);
      ctx.strokeRect(bx + pad, plankY, plankWidth, plankHeight);
    }
    
    // Draw vertical support beams
    ctx.fillStyle = onTarget ? '#1e8449' : '#8B6540';
    const beamWidth = 4;
    ctx.fillRect(bx + pad + 4, by + pad, beamWidth, TILE - pad * 2);
    ctx.fillRect(bx + TILE - pad - 4 - beamWidth, by + pad, beamWidth, TILE - pad * 2);
    
    // Draw border - bright green glow for solved boxes
    if (onTarget) {
      // Outer glow
      ctx.strokeStyle = 'rgba(46, 204, 113, 0.4)';
      ctx.lineWidth = 4;
      ctx.strokeRect(bx + pad - 1, by + pad - 1, TILE - pad * 2 + 2, TILE - pad * 2 + 2);
      // Inner border
      ctx.strokeStyle = '#2ecc71';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + pad, by + pad, TILE - pad * 2, TILE - pad * 2);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + pad, by + pad, TILE - pad * 2, TILE - pad * 2);
    }
  }

  {
    const px2 = playerX * TILE;
    const py2 = playerY * TILE;
    const cx = px2 + TILE / 2;
    const cy = py2 + TILE / 2;
    const size = TILE - 4;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(cx + 2, cy + 3, size * 0.45, size * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // Draw worker image with rotation based on direction
    ctx.save();
    ctx.translate(cx, cy);
    
    let angle = 0;
    if (playerDir === 'up') angle = 0;
    else if (playerDir === 'right') angle = Math.PI / 2;
    else if (playerDir === 'down') angle = Math.PI;
    else if (playerDir === 'left') angle = -Math.PI / 2;
    
    ctx.rotate(angle);
    
    console.log('Drawing player, img loaded:', workerImgLoaded, 'size:', size);
    if (workerImgLoaded) {
      ctx.drawImage(WORKER_IMG, -size/2, -size/2, size, size);
    } else {
      // Fallback: draw a simple colored circle
      ctx.fillStyle = '#3498db';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFD4A3';
      ctx.beginPath();
      ctx.arc(0, -size * 0.1, size * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  }
}

// ── Game logic ─────────────────────────────────────────────────────
function isWall(x, y) { return grid.walls.has(`${x},${y}`); }
function boxAt(x, y) { return grid.boxes.findIndex(b => b.x === x && b.y === y); }

function move(dx, dy) {
  if (won) return;
  const nx = playerX + dx;
  const ny = playerY + dy;
  if (isWall(nx, ny)) return;

  const bi = boxAt(nx, ny);
  if (bi >= 0) {
    const bx = nx + dx;
    const by = ny + dy;
    if (isWall(bx, by) || boxAt(bx, by) >= 0) return;
    history.push({ px: playerX, py: playerY, boxes: grid.boxes.map(b => ({ ...b })), moves, pushes });
    grid.boxes[bi].x = bx;
    grid.boxes[bi].y = by;
    pushes++;
  } else {
    history.push({ px: playerX, py: playerY, boxes: grid.boxes.map(b => ({ ...b })), moves, pushes });
  }

  // Update facing direction
  if (dx === 0 && dy === -1) playerDir = 'up';
  else if (dx === 0 && dy === 1) playerDir = 'down';
  else if (dx === -1 && dy === 0) playerDir = 'left';
  else if (dx === 1 && dy === 0) playerDir = 'right';
  
  playerX = nx;
  playerY = ny;
  moves++;
  updateUI();
  draw();
  checkWin();
}

function undo() {
  if (history.length === 0 || won) return;
  const state = history.pop();
  playerX = state.px;
  playerY = state.py;
  grid.boxes = state.boxes;
  moves = state.moves;
  pushes = state.pushes;
  updateUI();
  draw();
}

function checkWin() {
  const targetSet = new Set(grid.targets.map(t => `${t.x},${t.y}`));
  if (grid.boxes.every(b => targetSet.has(`${b.x},${b.y}`))) {
    won = true;
    
    // Save progress to localStorage
    const highestSolved = parseInt(localStorage.getItem('sokoban_highest_solved') || '0');
    if (currentLevel >= highestSolved) {
      localStorage.setItem('sokoban_highest_solved', String(currentLevel + 1));
    }
    
    document.getElementById('win-stats').textContent = `Solved in ${moves} moves and ${pushes} pushes!`;
    document.getElementById('win-overlay').classList.add('show');
  }
}

function hideWin() { document.getElementById('win-overlay').classList.remove('show'); }
function restartLevel() { hideWin(); loadLevel(currentLevel); }
function prevLevel() { hideWin(); loadLevel((currentLevel - 1 + TOTAL_LEVELS) % TOTAL_LEVELS); }
function nextLevel() { hideWin(); loadLevel((currentLevel + 1) % TOTAL_LEVELS); }

function updateUI() {
  document.getElementById('level-num').textContent = currentLevel + 1;
  document.getElementById('level-total').textContent = `/${TOTAL_LEVELS}`;
  document.getElementById('level-name').textContent = `"${LEVEL_NAMES[currentLevel]}"`;
  document.getElementById('move-count').textContent = moves;
  document.getElementById('push-count').textContent = pushes;
}

// ── Input ──────────────────────────────────────────────────────────
function goToLevel(num) {
  if (isNaN(num) || num < 1 || num > TOTAL_LEVELS) return;
  hideWin();
  loadLevel(num - 1);
}

document.addEventListener('keydown', e => {
  // Don't capture keys when typing in input
  if (e.target.tagName === 'INPUT') return;
  
  // Enter advances to next level when puzzle is solved
  if (e.key === 'Enter' && won) {
    nextLevel();
    hideWin();
    e.preventDefault();
    return;
  }
  
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0, -1); e.preventDefault(); break;
    case 'ArrowDown':  case 's': case 'S': move(0, 1);  e.preventDefault(); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move(1, 0);  e.preventDefault(); break;
    case 'z': case 'Z': undo(); break;
    case 'r': case 'R': restartLevel(); break;
    case 'n': case 'N': nextLevel(); break;
    case 'p': case 'P': prevLevel(); break;
  }
});

// ── Start ──────────────────────────────────────────────────────────
// Handle window resize
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    loadLevel(currentLevel);
  }, 200);
});

// Load saved progress or start from level 1
const savedProgress = parseInt(localStorage.getItem('sokoban_highest_solved') || '0');
const startLevel = savedProgress > 0 && savedProgress < TOTAL_LEVELS ? savedProgress : 0;
loadLevel(startLevel);
</script>
